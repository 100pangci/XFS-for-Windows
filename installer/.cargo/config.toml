# Keep the setup executable self-contained: no VC++ redistributable DLLs beside
# a per-machine installer that may run before any runtime is installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
