[package]
name = "xfswin-setup"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "xfswin-setup"
path = "src/main.rs"

[features]
# Only the acceptance test build enables this.  The public setup never
# accepts /test-fail.
test-fail = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
