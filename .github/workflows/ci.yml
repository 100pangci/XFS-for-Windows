name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIG: RelWithDebInfo

jobs:
  # ---------------------------------------------------------------------------
  # Windows: build, unit/integration tests, formatter round-trip, structural
  # probe, and artifacts for the Linux verification job.
  # ---------------------------------------------------------------------------
  windows-build-test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure (no WinFsp SDK needed here)
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DXFSWIN_BUILD_TESTS=ON -DXFSWIN_BUILD_WINFSP=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_CONFIG

      - name: Unit and integration tests
        shell: pwsh
        run: ctest --test-dir build -C $env:BUILD_CONFIG --output-on-failure

      - name: Format an image and validate it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build\src\$env:BUILD_CONFIG\xfswin.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          & $exe mkimage out\windows.img 300M
          if ($LASTEXITCODE -ne 0) { throw "mkimage failed" }
          & $exe format out\windows.img --yes-i-really-mean-it
          if ($LASTEXITCODE -ne 0) { throw "format failed" }
          & $exe info out\windows.img
          & $exe check out\windows.img --verbose
          if ($LASTEXITCODE -ne 0) { throw "check failed" }
          & $exe ls out\windows.img /
          if ($LASTEXITCODE -ne 0) { throw "ls failed" }

      - name: Independent structural probe (Python)
        shell: pwsh
        run: python tests/tools/xfs_probe.py out/windows.img

      - name: RW-6A modern inode profile (formatter + oracle)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build\src\$env:BUILD_CONFIG\xfswin.exe"
          & $exe mkimage out\modern.img 400M
          if ($LASTEXITCODE -ne 0) { throw "mkimage failed" }
          & $exe format out\modern.img --yes-i-really-mean-it --modern-inode-profile
          if ($LASTEXITCODE -ne 0) { throw "modern format failed" }
          & $exe create out\modern.img /modern.bin --rw-experimental
          if ($LASTEXITCODE -ne 0) { throw "modern create failed" }
          & $exe pwrite out\modern.img /modern.bin 0 --rw-experimental --text=modern
          if ($LASTEXITCODE -ne 0) { throw "modern write failed" }
          & $exe check out\modern.img --verbose
          if ($LASTEXITCODE -ne 0) { throw "modern check failed" }
          python tests/tools/rw6_inode_probe.py out/modern.img
          if ($LASTEXITCODE -ne 0) { throw "RW-6A oracle rejected the image" }

      - name: RW-6B Windows-formatted rmapbt image (oracle)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build\src\$env:BUILD_CONFIG\xfswin.exe"
          & $exe mkimage out\rw6b-rmap.img 300M
          if ($LASTEXITCODE -ne 0) { throw "mkimage failed" }
          & $exe format out\rw6b-rmap.img --yes-i-really-mean-it --rmapbt
          if ($LASTEXITCODE -ne 0) { throw "rmapbt format failed" }
          & $exe check out\rw6b-rmap.img --verbose
          if ($LASTEXITCODE -ne 0) { throw "rmapbt check failed" }
          & $exe recover out\rw6b-rmap.img --yes-i-really-mean-it
          if ($LASTEXITCODE -ne 0) { throw "rmapbt recovery preflight failed" }
          python tests/tools/rw6b_rmap_probe.py out/rw6b-rmap.img
          if ($LASTEXITCODE -ne 0) { throw "RW-6B oracle rejected the formatted image" }

      - name: RW-6C Windows-formatted reflink images (both profiles)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build\src\$env:BUILD_CONFIG\xfswin.exe"
          & $exe mkimage out\rw6c-rmap.img 300M
          if ($LASTEXITCODE -ne 0) { throw "mkimage rmap failed" }
          & $exe format out\rw6c-rmap.img --yes-i-really-mean-it --reflink --rmapbt
          if ($LASTEXITCODE -ne 0) { throw "reflink+rmapbt format failed" }
          & $exe check out\rw6c-rmap.img
          if ($LASTEXITCODE -ne 0) { throw "reflink+rmapbt check failed" }
          python tests/tools/rw6c_refcount_probe.py out/rw6c-rmap.img `
            --json out/rw6c-rmap.oracle.json
          if ($LASTEXITCODE -ne 0) { throw "oracle rejected rw6c-rmap.img" }

          & $exe mkimage out\rw6c-normap.img 300M
          if ($LASTEXITCODE -ne 0) { throw "mkimage normap failed" }
          & $exe format out\rw6c-normap.img --yes-i-really-mean-it --reflink
          if ($LASTEXITCODE -ne 0) { throw "reflink-only format failed" }
          & $exe check out\rw6c-normap.img
          if ($LASTEXITCODE -ne 0) { throw "reflink-only check failed" }
          python tests/tools/rw6c_refcount_probe.py out/rw6c-normap.img `
            --allow-no-rmapbt --json out/rw6c-normap.oracle.json
          if ($LASTEXITCODE -ne 0) { throw "oracle rejected rw6c-normap.img" }

      - name: RW-6D xattr fixture (1 KiB, every attribute representation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = "build\tests\$env:BUILD_CONFIG\xfs_tests.exe"
          $exe = "build\src\$env:BUILD_CONFIG\xfswin.exe"
          & $tests --make-rw6d-fixture out\rw6d-windows.img
          if ($LASTEXITCODE -ne 0) { throw "RW-6D fixture build failed" }
          & $exe check out\rw6d-windows.img
          if ($LASTEXITCODE -ne 0) { throw "RW-6D fixture check failed" }
          $manifest = Get-Content out\rw6d-windows.img.manifest.json -Raw |
            ConvertFrom-Json
          $oracleArgs = @(
            "tests/tools/rw6d_xattr_probe.py",
            "out/rw6d-windows.img",
            "--manifest", "out/rw6d-windows.img.manifest.json",
            "--json", "out/rw6d-windows.oracle.json",
            "--quiet")
          foreach ($item in $manifest.inodes) {
            $oracleArgs += "--inode"
            $oracleArgs += "$($item.ino)"
          }
          python @oracleArgs
          if ($LASTEXITCODE -ne 0) { throw "RW-6D fixture oracle failed" }
          python tests/tools/rw6d_format_assert.py out/rw6d-windows.oracle.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6D fixture format assertion failed" }

      - name: RW-6A sparse-chunk fixture (for Linux xfs_repair)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = "build\tests\$env:BUILD_CONFIG\xfs_tests.exe"
          & $tests --make-rw6-sparse out\rw6-sparse.img
          if ($LASTEXITCODE -ne 0) { throw "sparse fixture build failed" }
          python tests/tools/rw6_inode_probe.py out/rw6-sparse.img
          if ($LASTEXITCODE -ne 0) { throw "sparse fixture oracle failed" }
          & "build\src\$env:BUILD_CONFIG\xfswin.exe" check out\rw6-sparse.img
          if ($LASTEXITCODE -ne 0) { throw "sparse fixture check failed" }

      - name: Fixture image (one allocated file) for the RW tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = "build\tests\$env:BUILD_CONFIG\xfs_tests.exe"
          & $tests --make-fixture out\fixture.img
          if ($LASTEXITCODE -ne 0) { throw "fixture build failed" }
          python tests/tools/fixture_probe.py out/fixture.img
          if ($LASTEXITCODE -ne 0) { throw "fixture probe failed" }

      - name: In-place write path (CLI) on a copy of the fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build\src\$env:BUILD_CONFIG\xfswin.exe"
          Copy-Item out\fixture.img out\fixture-write.img
          # Refusals are the expected result and carry a nonzero exit code.
          # pwsh reports the status of the last native command as the step's
          # exit code, so every expected failure resets it explicitly.
          function Assert-Refused([int]$ExpectedCode, [string]$What, [scriptblock]$Block) {
            & $Block
            $actual = $LASTEXITCODE
            if ($actual -ne $ExpectedCode) {
              throw "$What`: expected exit code $ExpectedCode, got $actual"
            }
            $global:LASTEXITCODE = 0
            Write-Output "$What`: refused as expected (exit $actual)"
          }

          # In-place overwrite inside the fixture file's allocated extent.
          & $exe pwrite out\fixture-write.img /hello.bin 100 --rw-experimental --text=OVERWRITTEN
          if ($LASTEXITCODE -ne 0) { throw "pwrite failed" }
          & $exe pwrite out\fixture-write.img /hello.bin 0 --rw-experimental --text=x
          if ($LASTEXITCODE -ne 0) { throw "pwrite in place failed" }
          & $exe check out\fixture-write.img
          if ($LASTEXITCODE -ne 0) { throw "check failed after pwrite" }
          & $exe cat out\fixture-write.img /hello.bin | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "cat failed after pwrite" }

          # RW-2: writing past EOF grows the file through a real allocation
          # transaction, and truncate sets the size back.
          & $exe pwrite out\fixture-write.img /hello.bin 32768 --rw-experimental --text=GROWN
          if ($LASTEXITCODE -ne 0) { throw "growing write failed" }
          & $exe truncate out\fixture-write.img /hello.bin 32000 --rw-experimental
          if ($LASTEXITCODE -ne 0) { throw "truncate failed" }
          & $exe check out\fixture-write.img
          if ($LASTEXITCODE -ne 0) { throw "check failed after growth/truncate" }
          python tests/tools/rw2_probe.py out/fixture-write.img --quiet
          if ($LASTEXITCODE -ne 0) { throw "the independent oracle rejected the image" }

          # Writes without the confirmation flag and read-write mounts of real
          # devices are refused; the refusal must not change the image.
          Assert-Refused 3 "write without --rw-experimental" {
            & $exe pwrite out\fixture-write.img /hello.bin 0 --text=x
          }
          Assert-Refused 3 "read-write mount of a raw device" {
            & $exe mount \\.\PhysicalDrive0 Y: --rw-experimental
          }
          & $exe check out\fixture-write.img
          if ($LASTEXITCODE -ne 0) { throw "check failed after refused writes" }
          Write-Output "in-place write checks passed"

      - name: Crash matrix (kill every write phase)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_crash_windows.ps1 `
            -Exe "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Tests "build\tests\$env:BUILD_CONFIG\xfs_tests.exe" `
            -WorkDir "crash"
          if ($LASTEXITCODE -ne 0) { throw "crash matrix failed" }

      - name: RW-2 round-trip images (extend / truncate / reuse / btree)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw2_windows.ps1 `
            -Exe "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Tests "build\tests\$env:BUILD_CONFIG\xfs_tests.exe" `
            -WorkDir "rw2"
          if ($LASTEXITCODE -ne 0) { throw "RW-2 round-trip image generation failed" }

      - name: RW-2 crash matrix (allocator + extent map + size)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_crash_rw2_windows.ps1 `
            -Exe "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Tests "build\tests\$env:BUILD_CONFIG\xfs_tests.exe" `
            -WorkDir "crash-rw2"
          if ($LASTEXITCODE -ne 0) { throw "RW-2 crash matrix failed" }

      - name: RW-3 round-trip images (create / mkdir / unlink / rmdir)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw3_windows.ps1 `
            -Exe "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Tests "build\tests\$env:BUILD_CONFIG\xfs_tests.exe" `
            -WorkDir "rw3"
          if ($LASTEXITCODE -ne 0) { throw "RW-3 round-trip image generation failed" }

      - name: RW-3 crash matrix (create / mkdir / unlink / rmdir)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_crash_rw3_windows.ps1 `
            -Exe "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Tests "build\tests\$env:BUILD_CONFIG\xfs_tests.exe" `
            -WorkDir "crash-rw3"
          if ($LASTEXITCODE -ne 0) { throw "RW-3 crash matrix failed" }

      - name: RW-4 round-trip images (rename / hardlink / symlink)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw4_windows.ps1 `
            -Exe "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Tests "build\tests\$env:BUILD_CONFIG\xfs_tests.exe" `
            -WorkDir "rw4"
          if ($LASTEXITCODE -ne 0) { throw "RW-4 round-trip image generation failed" }

      - name: RW-4 crash matrix (rename / hardlink / symlink)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_crash_rw4_windows.ps1 `
            -Exe "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Tests "build\tests\$env:BUILD_CONFIG\xfs_tests.exe" `
            -WorkDir "crash-rw4"
          if ($LASTEXITCODE -ne 0) { throw "RW-4 crash matrix failed" }

      - name: Upload the crash images
        uses: actions/upload-artifact@v4
        with:
          name: rw-crash
          path: crash/
          if-no-files-found: error

      - name: Upload the RW-2 round-trip images
        uses: actions/upload-artifact@v4
        with:
          name: rw2-images
          path: rw2/
          if-no-files-found: error

      - name: Upload the RW-2 crash images
        uses: actions/upload-artifact@v4
        with:
          name: rw2-crash
          path: crash-rw2/
          if-no-files-found: error

      - name: Upload the RW-3 round-trip images
        uses: actions/upload-artifact@v4
        with:
          name: rw3-images
          path: rw3/
          if-no-files-found: error

      - name: Upload the RW-3 crash images
        uses: actions/upload-artifact@v4
        with:
          name: rw3-crash
          path: crash-rw3/
          if-no-files-found: error

      - name: Upload the RW-4 round-trip images
        uses: actions/upload-artifact@v4
        with:
          name: rw4-images
          path: rw4/
          if-no-files-found: error

      - name: Upload the RW-4 crash images
        uses: actions/upload-artifact@v4
        with:
          name: rw4-crash
          path: crash-rw4/
          if-no-files-found: error

      - name: Upload xfswin.exe
        uses: actions/upload-artifact@v4
        with:
          name: xfswin-exe
          path: build/src/${{ env.BUILD_CONFIG }}/xfswin.exe
          if-no-files-found: error

      - name: Upload Windows-formatted image
        uses: actions/upload-artifact@v4
        with:
          name: windows-image
          path: out/windows.img
          if-no-files-found: error

      - name: Upload fixture image
        uses: actions/upload-artifact@v4
        with:
          name: fixture-image
          path: out/fixture.img
          if-no-files-found: error

      - name: Upload the RW-6A Windows-formatted image
        uses: actions/upload-artifact@v4
        with:
          name: rw6-windows-formatted
          path: out/modern.img
          if-no-files-found: error

      - name: Upload the RW-6A sparse-chunk fixture
        uses: actions/upload-artifact@v4
        with:
          name: rw6-sparse-fixture
          path: out/rw6-sparse.img
          if-no-files-found: error

      - name: Upload the RW-6B Windows-formatted rmapbt image
        uses: actions/upload-artifact@v4
        with:
          name: rw6b-windows-rmap
          path: out/rw6b-rmap.img
          if-no-files-found: error

      - name: Upload the RW-6C Windows-formatted reflink images
        uses: actions/upload-artifact@v4
        with:
          name: rw6c-windows-formatted
          path: |
            out/rw6c-rmap.img
            out/rw6c-normap.img
          if-no-files-found: error

      - name: Upload the RW-6D Windows xattr fixture
        uses: actions/upload-artifact@v4
        with:
          name: rw6d-windows-fixture
          path: |
            out/rw6d-windows.img
            out/rw6d-windows.img.manifest.json
            out/rw6d-windows.oracle.json
          if-no-files-found: error

  # ===========================================================================
  # RW-6A: modern inode feature profile
  # (finobt + inobtcount + sparse inodes + bigtime + NREXT64)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Linux creates the canonical modern-inode fixture with the distribution's
  # mkfs.xfs: no rmapbt/reflink/parent pointers (still refused by the writer).
  # ---------------------------------------------------------------------------
  linux-generate-rw6-modern:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Create and populate the modern-inode image
        run: |
          mkfs.xfs -V
          sudo env SIZE_MB=1536 bash tests/scripts/make_rw6_modern_linux.sh rw6
          sudo chown -R "$USER" rw6
          cat rw6/modern.xfs_info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rw6-linux-modern
          path: rw6/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The Windows formatter's optional modern profile is checked by real xfs_db,
  # xfs_repair and a Linux writable mount.
  # ---------------------------------------------------------------------------
  linux-verify-rw6-formatted:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6-windows-formatted
          path: rw6-formatted

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows-formatted modern profile
        run: |
          sudo bash tests/scripts/verify_windows_image_linux.sh \
            rw6-formatted/modern.img
          python3 tests/tools/rw6_inode_probe.py rw6-formatted/modern.img

  # ---------------------------------------------------------------------------
  # A Windows-written sparse chunk (nonzero holemask, ICREATE + subsequent
  # inode allocation) must be accepted by the real Linux kernel and xfs_repair.
  # ---------------------------------------------------------------------------
  linux-verify-rw6-sparse:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6-sparse-fixture
          path: rw6-sparse

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows sparse-chunk fixture
        run: |
          sudo bash tests/scripts/verify_windows_image_linux.sh \
            rw6-sparse/rw6-sparse.img
          python3 tests/tools/rw6_inode_probe.py rw6-sparse/rw6-sparse.img

  # ---------------------------------------------------------------------------
  # RW-6B: the Windows formatter's rmapbt=1,reflink=0 profile must be accepted
  # by real xfs_repair, mount and a writable Linux pass (which itself updates
  # the reverse mappings).  This is also the reverse-interoperability check for
  # the formatter's ownership records.
  # ---------------------------------------------------------------------------
  linux-verify-rw6b-formatted:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-windows-rmap
          path: rw6b-formatted

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows-formatted rmapbt image with Linux
        run: |
          sudo bash tests/scripts/verify_windows_image_linux.sh \
            rw6b-formatted/rw6b-rmap.img
          python3 tests/tools/rw6b_rmap_probe.py rw6b-formatted/rw6b-rmap.img

  # ---------------------------------------------------------------------------
  # RW-6B: Linux creates and populates a real rmapbt=1,reflink=0 image with
  # every forward structure the Windows reader/writer must handle.  The fixture
  # is required to have an rmapbt at level >= 2.
  # ---------------------------------------------------------------------------
  linux-generate-rw6b-rmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Create and populate the rmapbt fixture
        run: |
          mkfs.xfs -V
          sudo env SIZE_MB=2048 bash tests/scripts/make_rw6b_rmap_linux.sh rw6b
          sudo chown -R "$USER" rw6b
          cat rw6b/rmap.layout.txt
          python3 tests/tools/rw6b_rmap_probe.py rw6b/rmap.img

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-linux-rmap
          path: rw6b/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows reads the Linux-created rmapbt image: typed traversal, CLI dump,
  # independent ownership oracle, reader differential.
  # ---------------------------------------------------------------------------
  windows-read-rw6b-rmap:
    needs: [windows-build-test, linux-generate-rw6b-rmap]
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-linux-rmap
          path: rw6b

      - name: Read and validate the Linux rmapbt image
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw6b_read_windows.ps1 `
            -Exe "bin\xfswin.exe" -Image "rw6b\rmap.img"
          if ($LASTEXITCODE -ne 0) { throw "RW-6B Windows read validation failed" }

      - name: Refuse malformed Linux rmap metadata without writes
        shell: pwsh
        run: |
          python tests/tools/rw6b_refusal_check.py --exe "bin\xfswin.exe" `
            --source "rw6b\rmap.img" --kind metadata --work-dir rw6b-refusals
          if ($LASTEXITCODE -ne 0) { throw "RW-6B metadata refusal matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-metadata-refusals
          path: rw6b-refusals/refusals.json
          if-no-files-found: error

  windows-rw6b-tree:
    needs: [windows-build-test, linux-generate-rw6b-rmap]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: rw6b-linux-rmap
          path: rw6b
      - name: Exercise actual rmap internal splits and collapse
        shell: pwsh
        run: |
          python tests/tools/rw6b_tree_check.py --exe "bin\xfswin.exe" `
            --source "rw6b\rmap-tree.img" --work-dir rw6b-tree
          if ($LASTEXITCODE -ne 0) { throw "RW-6B real-image tree matrix failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-tree
          path: rw6b-tree/
          if-no-files-found: error

  linux-verify-rw6b-tree:
    needs: windows-rw6b-tree
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rw6b-tree
          path: rw6b-tree
      - run: sudo apt-get update && sudo apt-get install -y xfsprogs
      - name: Verify the grown and collapsed Linux-origin tree
        run: |
          for image in rw6b-tree/*.img; do
            sudo bash tests/scripts/verify_windows_image_linux.sh "$image"
            python3 tests/tools/rw6b_rmap_probe.py "$image"
          done
          cat rw6b-tree/tree.json

  # ---------------------------------------------------------------------------
  # RW-6B: Windows mutates the Linux-created rmapbt image through the ordinary
  # writer API (hidden qualification flag; the public gate stays closed).  The
  # matrix covers every supported metadata class, runs the independent
  # forward-derived oracle after every named stage, and leaves an image plus
  # expected.json for Linux.
  # ---------------------------------------------------------------------------
  windows-rw6b-mutation:
    needs: [windows-build-test, linux-generate-rw6b-rmap]
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-linux-rmap
          path: rw6b

      - name: Mutate the Linux-created rmapbt image
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw6b_mutation_windows.ps1 `
            -Exe "bin\xfswin.exe" -SourceImage "rw6b\rmap.img" `
            -WorkDir "rw6b-mutated"
          if ($LASTEXITCODE -ne 0) { throw "RW-6B Windows mutation matrix failed" }
          Copy-Item "rw6b\MANIFEST.sha256" "rw6b-mutated\MANIFEST.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-windows-mutated
          path: rw6b-mutated/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # RW-6B: Linux accepts the Windows mutation, verifies every original fixture
  # entry and every expected Windows result, dumps xfs_db layout, then mutates
  # the same image again (reverse interoperability).
  # ---------------------------------------------------------------------------
  linux-verify-rw6b-mutation:
    needs: windows-rw6b-mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-windows-mutated
          path: rw6b-mutated

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify and then mutate the Windows image with Linux
        run: |
          sudo bash tests/scripts/verify_rw6b_windows_mutation_linux.sh \
            rw6b-mutated/rmap-windows.img \
            rw6b-mutated/MANIFEST.sha256 \
            rw6b-mutated/expected.json \
            rw6b-linux
          sudo chown -R "$USER" rw6b-linux

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-linux-mutated
          path: |
            rw6b-mutated/rmap-windows.img
            rw6b-linux/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # RW-6B: Windows accepts the Linux-mutated image, verifies the Linux changes,
  # mutates it again and writes the final expected state for Linux.
  # ---------------------------------------------------------------------------
  windows-rw6b-reverse:
    needs: linux-verify-rw6b-mutation
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-linux-mutated
          path: rw6b-linux

      - name: Reverse-read and mutate after the Linux pass
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw6b_reverse_windows.ps1 `
            -Exe "bin\xfswin.exe" `
            -SourceImage "rw6b-linux\rw6b-mutated\rmap-windows.img" `
            -WorkDir "rw6b-round2"
          if ($LASTEXITCODE -ne 0) { throw "RW-6B Windows reverse mutation failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-windows-round2
          path: |
            rw6b-round2/rmap-windows-round2.img
            rw6b-round2/round2.expected.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # RW-6B: final Linux acceptance after Windows -> Linux -> Windows.  Repair,
  # full manifest/expected-state check, independent oracle, one more Linux
  # mutation, final repair/oracle/xfs_db.
  # ---------------------------------------------------------------------------
  linux-verify-rw6b-final:
    needs: windows-rw6b-reverse
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-windows-round2
          path: rw6b-round2

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-windows-mutated
          path: rw6b-mutated

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Final Linux acceptance and reverse churn
        run: |
          sudo bash tests/scripts/verify_rw6b_final_linux.sh \
            rw6b-round2/rmap-windows-round2.img \
            rw6b-mutated/MANIFEST.sha256 \
            rw6b-round2/round2.expected.json \
            rw6b-final
          sudo chown -R "$USER" rw6b-final

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-final-evidence
          path: rw6b-final/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # RW-6B near-ENOSPC on a real Linux rmapbt image: allocation plus rmap
  # metadata must commit completely or fail before the first metadata write.
  # ---------------------------------------------------------------------------
  windows-rw6b-enospc:
    needs: [windows-build-test, linux-generate-rw6b-rmap]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-linux-rmap
          path: rw6b

      - name: Fill the Linux image and force allocation refusal
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw6b_enospc_windows.ps1 `
            -Exe "bin\xfswin.exe" -SourceImage "rw6b\rmap.img" `
            -WorkDir "rw6b-enospc"
          if ($LASTEXITCODE -ne 0) { throw "RW-6B near-ENOSPC qualification failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-enospc-image
          path: |
            rw6b-enospc/rmap-enospc.img
            rw6b-enospc/enospc.json
          if-no-files-found: error

  linux-verify-rw6b-enospc:
    needs: windows-rw6b-enospc
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-enospc-image
          path: rw6b-enospc

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the near-ENOSPC image with Linux
        run: |
          sudo bash tests/scripts/verify_rw6b_enospc_linux.sh \
            rw6b-enospc/rmap-enospc.img rw6b-enospc/enospc.json

  # ---------------------------------------------------------------------------
  # RW-6B: writer crash matrix on a real Linux-created rmapbt filesystem.
  # ---------------------------------------------------------------------------
  linux-generate-rw6b-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Build the Linux rmapbt crash fixture
        run: |
          sudo env SIZE_MB=384 bash tests/scripts/make_rw6b_crash_linux.sh \
            rw6b-crash
          sudo chown -R "$USER" rw6b-crash

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-linux-crash
          path: |
            rw6b-crash/rmap-crash.img
            rw6b-crash/rmap-crash.xfs_info.txt
          if-no-files-found: error

  windows-rw6b-crash:
    needs: [windows-build-test, linux-generate-rw6b-crash]
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-linux-crash
          path: rw6b-crash

      - name: Run the RW-6B writer crash matrix
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_crash_rw6b_windows.ps1 `
            -Exe "bin\xfswin.exe" -SourceImage "rw6b-crash\rmap-crash.img" `
            -WorkDir "crash-rw6b"
          if ($LASTEXITCODE -ne 0) { throw "RW-6B writer crash matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-crash
          path: |
            crash-rw6b/*.zip
            crash-rw6b/cases.json
          if-no-files-found: error

  linux-verify-rw6b-crash:
    needs: windows-rw6b-crash
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-crash
          path: crash-rw6b

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Replay every crash image with Linux
        run: |
          sudo bash tests/scripts/verify_rw6b_crash_linux.sh crash-rw6b

  # ---------------------------------------------------------------------------
  # RW-6B: capture a genuine Linux log with a committed RUI that survives
  # without a matching RUD.  This is a real kernel log from a fragmented-file
  # truncate workload; xfs_logprint and recovery_probe.py must both see it.
  # ---------------------------------------------------------------------------
  linux-generate-rw6b-rui:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs and device-mapper
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs dmsetup

      - name: Capture a surviving RUI
        run: |
          sudo env SIZE_MB=768 FILES=6 EXTENTS=6000 ROUNDS=40 \
            MAX_SNAPS=1200 COW_MB=256 \
            bash tests/scripts/make_rw6b_rui_linux.sh rw6b-rui
          sudo chown -R "$USER" rw6b-rui
          cat rw6b-rui/rui.manifest.json
          grep -q RUI rw6b-rui/rui.logprint.txt
          python3 tests/tools/recovery_probe.py rw6b-rui/rui.img --json \
            > /tmp/rui.json
          grep -q '"XFS_LI_RUI"' /tmp/rui.json

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-linux-rui
          path: rw6b-rui/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows completes the genuine surviving RUI in one transaction and the
  # independent oracle checks the result.
  # ---------------------------------------------------------------------------
  windows-recover-rw6b-rui:
    needs: [windows-build-test, linux-generate-rw6b-rui]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-linux-rui
          path: rw6b-rui

      - name: Complete the surviving RUI with Windows
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw6b_rui_windows.ps1 `
            -Exe "bin\xfswin.exe" -SourceImage "rw6b-rui\rui.img" `
            -WorkDir "rw6b-recovered"
          if ($LASTEXITCODE -ne 0) { throw "RW-6B surviving-RUI recovery failed" }

      - name: Refuse shared RUI operations without writes
        shell: pwsh
        run: |
          python tests/tools/rw6b_refusal_check.py --exe "bin\xfswin.exe" `
            --source "rw6b-rui\rui.img" --kind shared-rui `
            --work-dir rw6b-recovered/shared-refusals
          if ($LASTEXITCODE -ne 0) { throw "RW-6B shared-RUI refusal matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-windows-recovered-rui
          path: rw6b-recovered/
          if-no-files-found: error

  linux-verify-rw6b-rui:
    needs: windows-recover-rw6b-rui
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-windows-recovered-rui
          path: rw6b-recovered

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows RUI completion with Linux
        run: |
          sudo bash tests/scripts/verify_windows_image_linux.sh \
            rw6b-recovered/rui-windows.img
          python3 tests/tools/rw6b_rmap_probe.py \
            rw6b-recovered/rui-windows.img

  # ---------------------------------------------------------------------------
  # RW-6B: crash Windows while it completes the genuine RUI, restart recovery,
  # then verify every recovered image with Linux.
  # ---------------------------------------------------------------------------
  windows-rw6b-rui-crash:
    needs: [windows-build-test, linux-generate-rw6b-rui]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-linux-rui
          path: rw6b-rui

      - name: Crash and restart the genuine RUI completion
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw6b_rui_crash_windows.ps1 `
            -Exe "bin\xfswin.exe" -SourceImage "rw6b-rui\rui.img" `
            -WorkDir "rw6b-rui-crash"
          if ($LASTEXITCODE -ne 0) { throw "RW-6B RUI completion crash matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6b-rui-crash
          path: rw6b-rui-crash/*.zip
          if-no-files-found: error

  linux-verify-rw6b-rui-crash:
    needs: windows-rw6b-rui-crash
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6b-rui-crash
          path: rw6b-rui-crash

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify every restarted RUI completion on Linux
        run: |
          mkdir -p rw6b-rui-crash/current empty-dirty
          checked=0
          for archive in rw6b-rui-crash/*.zip; do
            [ -e "$archive" ] || continue
            unzip -o "$archive" -d rw6b-rui-crash/current
            sudo bash tests/scripts/verify_recovery_rw6_linux.sh \
              empty-dirty rw6b-rui-crash/current
            python3 tests/tools/rw6b_rmap_probe.py \
              rw6b-rui-crash/current/*.img
            rm rw6b-rui-crash/current/*.img
            checked=$((checked + 1))
          done
          test "$checked" -eq 11
          echo "Verified all $checked restarted RUI completion images"

  # ---------------------------------------------------------------------------
  # Windows mutates the Linux-created image (create/write/truncate/rename/
  # link/symlink/inode churn), then the independent RW-6A oracle checks it.
  # ---------------------------------------------------------------------------
  windows-rw6-modern-roundtrip:
    needs: [windows-build-test, linux-generate-rw6-modern]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6-linux-modern
          path: rw6

      - name: Mutate and validate the modern image
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw6_windows.ps1 `
            -Exe "bin\xfswin.exe" -SourceImage "rw6\modern.img" `
            -WorkDir "rw6-windows"
          if ($LASTEXITCODE -ne 0) { throw "RW-6A Windows roundtrip failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6-windows-mutated
          path: rw6-windows/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux verifies the Windows mutation, then mutates the same image again
  # (reverse interoperability).
  # ---------------------------------------------------------------------------
  linux-verify-rw6-modern:
    needs: windows-rw6-modern-roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6-windows-mutated
          path: rw6-windows

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows mutation with Linux and xfs_repair
        run: |
          sudo bash tests/scripts/verify_rw6_linux.sh \
            rw6-windows/modern-windows.img --windows-mutated

      - name: Linux mutates the image again
        run: |
          cp rw6-windows/modern-windows.img rw6-windows/reverse.img
          sudo bash tests/scripts/verify_rw6_linux_reverse.sh \
            rw6-windows/reverse.img

      - uses: actions/upload-artifact@v4
        with:
          name: rw6-linux-reverse
          path: rw6-windows/reverse.img
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows re-reads and mutates the Linux-reverse image.
  # ---------------------------------------------------------------------------
  windows-verify-rw6-reverse:
    needs: linux-verify-rw6-modern
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6-linux-reverse
          path: rw6-reverse

      - name: Read and mutate after the Linux pass
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw6_reverse_windows.ps1 `
            -Exe "bin\xfswin.exe" -Image "rw6-reverse\reverse.img"
          if ($LASTEXITCODE -ne 0) { throw "RW-6A reverse interoperability failed" }

  # ---------------------------------------------------------------------------
  # Windows crash matrix on the modern profile, then Linux validates every
  # recovered image (clean log, xfs_repair -n, mount).
  # ---------------------------------------------------------------------------
  windows-rw6-crash:
    needs: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - name: Run the RW-6A crash matrix
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_crash_rw6_windows.ps1 `
            -Exe "bin\xfswin.exe" -WorkDir "crash-rw6"
          if ($LASTEXITCODE -ne 0) { throw "RW-6A crash matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6-crash
          path: crash-rw6/*.zip
          if-no-files-found: error

  linux-verify-rw6-crash:
    needs: windows-rw6-crash
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6-crash
          path: crash-rw6

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify recovered crash images with Linux
        run: |
          mkdir -p empty-dirty crash-rw6/current
          checked=0
          for archive in crash-rw6/*.zip; do
            [ -e "$archive" ] || continue
            # 176 images are ~69 GiB expanded. Verify one at a time rather
            # than filling the runner disk before the first repair check.
            unzip -o "$archive" -d crash-rw6/current
            sudo bash tests/scripts/verify_recovery_rw6_linux.sh \
              empty-dirty crash-rw6/current
            rm crash-rw6/current/*.img
            checked=$((checked + 1))
          done
          test "$checked" -eq 176
          echo "Verified all $checked crash archives"

  # ---------------------------------------------------------------------------
  # Linux dirty logs on the modern profile -> Windows RW-5 recovery -> Linux
  # verification. This covers finobt/finobt buffers, sparse ICREATE and bigtime
  # inode items in the real kernel log format.
  # ---------------------------------------------------------------------------
  linux-generate-rw6-dirty:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Capture modern-profile dirty logs
        run: |
          sudo env SIZE_MB=512 \
            MKFS_OPTS='-m crc=1,finobt=1,inobtcount=1,bigtime=1,rmapbt=0,reflink=0 -i sparse=1,nrext64=1' \
            bash tests/scripts/make_dirty_logs_linux.sh rw6-dirty
          sudo chown -R "$USER" rw6-dirty

      - uses: actions/upload-artifact@v4
        with:
          name: rw6-dirty
          path: rw6-dirty/
          if-no-files-found: error

  windows-recover-rw6-dirty:
    needs: [windows-build-test, linux-generate-rw6-dirty]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6-dirty
          path: rw6-dirty

      - name: Recover Linux modern-profile dirty logs
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_recovery_rw6_windows.ps1 `
            -Exe "bin\xfswin.exe" -WorkDir "rw6-dirty" `
            -OutDir "rw6-recovered"
          if ($LASTEXITCODE -ne 0) { throw "RW-6A cross-recovery failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6-recovered
          path: rw6-recovered/
          if-no-files-found: error

  linux-verify-rw6-cross-recovery:
    needs: windows-recover-rw6-dirty
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6-recovered
          path: rw6-recovered

      - uses: actions/download-artifact@v4
        with:
          name: rw6-dirty
          path: rw6-dirty

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify Windows-recovered modern logs with Linux
        run: |
          sudo bash tests/scripts/verify_recovery_rw6_linux.sh \
            rw6-dirty rw6-recovered

  # ---------------------------------------------------------------------------
  # Diagnostic job: dump the layout produced by the distro's real mkfs.xfs so
  # the formatter can be compared against a live reference.
  # ---------------------------------------------------------------------------
  linux-reference-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dump a fresh mkfs.xfs layout
        run: |
          set -x
          mkfs.xfs -V
          truncate -s 300M /tmp/ref.img
          mkfs.xfs -f /tmp/ref.img
          echo "=== sb fields ==="
          xfs_db -r -c 'sb 0' -c 'p rbmino rsumino rootino rextsize versionnum features_incompat features_ro_compat' /tmp/ref.img
          echo "=== root inode core ==="
          xfs_db -r -c 'inode 128' -c 'p core' /tmp/ref.img
          echo "=== root inode dir data ==="
          xfs_db -r -c 'inode 128' -c 'p u' /tmp/ref.img
          echo "=== inode 129 (rt bitmap) ==="
          xfs_db -r -c 'inode 129' -c 'p core' /tmp/ref.img
          echo "=== inode 129 dir/attr ==="
          xfs_db -r -c 'inode 129' -c 'p u' /tmp/ref.img || true
          echo "=== inode 130 (rt summary) ==="
          xfs_db -r -c 'inode 130' -c 'p core' /tmp/ref.img
          echo "=== inode 131 (free inode core) ==="
          xfs_db -r -c 'inode 131' -c 'p core' /tmp/ref.img
          echo "=== agi 0 ==="
          xfs_db -r -c 'agi 0' -c 'p count freecount root level' /tmp/ref.img
          echo "=== agf 0 ==="
          xfs_db -r -c 'agf 0' -c 'p freeblks longest btreeblks flcount flfirst fllast' /tmp/ref.img
          echo "=== inobt root ==="
          xfs_db -r -c 'agi 0' -c 'addr root' -c 'p' /tmp/ref.img || true
          echo "=== inode 128 check ==="
          xfs_db -r -c 'inode 128' -c 'check' /tmp/ref.img || true
          echo
          echo "=== minimal-feature image (mirrors the Windows formatter profile) ==="
          truncate -s 300M /tmp/ref-min.img
          mkfs.xfs -f -m crc=1,finobt=0,rmapbt=0,reflink=0,bigtime=0,inobtcount=0 \
              -i sparse=0 /tmp/ref-min.img
          xfs_db -r -c 'sb 0' -c 'p rootino rbmino rsumino rextsize agblocks agcount blocks logstart logblocks versionnum' /tmp/ref-min.img
          echo "=== min root inode core ==="
          xfs_db -r -c 'inode 64' -c 'p core' /tmp/ref-min.img
          echo "=== min root dir data ==="
          xfs_db -r -c 'inode 64' -c 'p u' /tmp/ref-min.img
          echo "=== min rt bitmap inode (65) ==="
          xfs_db -r -c 'inode 65' -c 'p core' /tmp/ref-min.img
          echo "=== min rt summary inode (66) ==="
          xfs_db -r -c 'inode 66' -c 'p core' /tmp/ref-min.img
          echo "=== min free inode (67) ==="
          xfs_db -r -c 'inode 67' -c 'p core' /tmp/ref-min.img || true
          echo "=== min agi 0 ==="
          xfs_db -r -c 'agi 0' -c 'p count freecount root level' /tmp/ref-min.img
          echo "=== min agf 0 ==="
          xfs_db -r -c 'agf 0' -c 'p freeblks longest btreeblks flcount flfirst fllast' /tmp/ref-min.img
          echo "=== min inobt root ==="
          xfs_db -r -c 'agi 0' -c 'addr root' -c 'p' /tmp/ref-min.img || true
          echo
          echo "=== raw sb bytes 240..272 (both images) ==="
          od -A d -t x1 -j 240 -N 32 /tmp/ref.img
          od -A d -t x1 -j 240 -N 32 /tmp/ref-min.img
          echo
          echo "=== xfs_repair -n on real mkfs images ==="
          set +e
          xfs_repair -n /tmp/ref.img; echo "repair(default) exit=$?"
          xfs_repair -n /tmp/ref-min.img; echo "repair(minimal) exit=$?"
          set -e

  # ---------------------------------------------------------------------------
  # Linux: verify the Windows-formatted image with the real xfsprogs, then
  # create a populated golden image written by Linux for the reader test.
  # ---------------------------------------------------------------------------
  linux-verify-windows:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-image
          path: images

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Probe and verify the Windows-formatted image
        run: |
          ls -l images/windows.img
          sudo bash tests/scripts/verify_windows_image_linux.sh images/windows.img

      - uses: actions/download-artifact@v4
        with:
          name: fixture-image
          path: fixture

      - name: Verify the fixture image (one allocated file) with Linux
        run: |
          ls -l fixture/fixture.img
          sudo bash tests/scripts/verify_fixture_linux.sh fixture/fixture.img

      - name: Populate the read-write interoperability image
        run: |
          sudo bash tests/scripts/make_rw_image.sh images/windows.img rw
          ls -l rw

      - name: Upload the read-write image (populated by Linux)
        uses: actions/upload-artifact@v4
        with:
          name: rw-image
          path: |
            rw/rw.img
            rw/rw-overlay.bin
            rw/rw-recipe.json
            rw/rw-pristine.sha256
            rw/rw-repair.log
          if-no-files-found: error

      - name: Create populated golden image (Linux mkfs + kernel)
        env:
          GOLDEN_POPULATED_SIZE: 512M
          GOLDEN_LARGE_MB: "32"
          GOLDEN_SPARSE_SIZE: 128M
          GOLDEN_BIGDIR_COUNT: "5000"
          GOLDEN_FRAG_COUNT: "300"
        run: |
          sudo -E bash tests/scripts/make_golden_images.sh golden --ci
          ls -lh golden

      - name: Upload Linux golden image
        uses: actions/upload-artifact@v4
        with:
          name: linux-golden
          path: |
            golden/populated.img
            golden/populated.manifest.json
            golden/golden-summary.txt
            golden/populated.ls.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows reader against the Linux-created golden image: differential test
  # of listing, Unicode names, file data (sha256), sparse files, extent btree,
  # symlinks and consistency checking.
  # ---------------------------------------------------------------------------
  windows-read-linux-image:
    needs: linux-verify-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: linux-golden
          path: golden

      - name: Reader differential test
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_reader_windows.ps1 `
            -Xfswin "bin\xfswin.exe" `
            -Image "golden\populated.img" `
            -Manifest "golden\populated.manifest.json"

  # ---------------------------------------------------------------------------
  # WinFsp mount: install the runtime, build with the SDK, mount the Linux
  # image read-only and verify reads, write rejection and clean unmount.
  # ---------------------------------------------------------------------------
  windows-mount:
    needs: linux-verify-windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-golden
          path: golden

      - uses: actions/download-artifact@v4
        with:
          name: rw-image
          path: rw

      - name: Install WinFsp runtime and extract the SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $msi = Join-Path $PWD 'winfsp.msi'
          Invoke-WebRequest `
            -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' `
            -OutFile $msi
          $p = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          "runtime install exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "WinFsp runtime install failed with $($p.ExitCode)"
          }
          $p = Start-Process msiexec.exe -ArgumentList @('/a', $msi, '/qn', "TARGETDIR=$PWD\sdk") -Wait -PassThru
          "sdk extract exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "WinFsp SDK extraction failed with $($p.ExitCode)" }
          Get-ChildItem "$PWD\sdk" | Select-Object Name
          if (-not (Test-Path "$PWD\sdk\DYNAMIC\inc\winfsp\winfsp.h")) {
            throw "SDK layout unexpected: DYNAMIC/inc/winfsp/winfsp.h not found"
          }

      - name: Verify the WinFsp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Service | Where-Object { $_.Name -match 'winfsp' } | Format-Table Name,Status -AutoSize
          sc.exe query winfsp
          sc.exe query WinFsp.Launcher
          Get-Item 'C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll' |
            Select-Object FullName,Length
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Root

      - name: Build with WinFsp support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DXFSWIN_BUILD_TESTS=OFF -DXFSWIN_BUILD_WINFSP=ON `
            -DXFSWIN_WINFSP_ROOT="$PWD\sdk\DYNAMIC"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --config $env:BUILD_CONFIG
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Provide winfsp-x64.dll next to the executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem 'C:\Program Files (x86)\WinFsp' -Recurse -Filter 'winfsp-x64.dll' |
                 Select-Object -First 1
          if (-not $dll) { throw "winfsp-x64.dll not found after installation" }
          "using $($dll.FullName)"
          Copy-Item $dll.FullName "build\src\$env:BUILD_CONFIG\"

      - name: Adapter self-test (no driver required)
        shell: pwsh
        run: |
          $exe = "build\src\$env:BUILD_CONFIG\xfswin.exe"
          & $exe selftest "golden\populated.img"
          if ($LASTEXITCODE -ne 0) { throw "adapter selftest failed" }
          # Read-write self-test: overwrites bytes inside an existing file
          # through the real Write/Flush callbacks.
          Copy-Item "rw\rw.img" "rw\rw-selftest.img"
          & $exe selftest "rw\rw-selftest.img" --rw-experimental
          if ($LASTEXITCODE -ne 0) { throw "read-write adapter selftest failed" }

      - name: Mount and verify read-only semantics
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_mount_windows.ps1 `
            -Xfswin "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Image "golden\populated.img" `
            -Manifest "golden\populated.manifest.json"

      - name: Mount read-write and overwrite existing data
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_mount_rw_windows.ps1 `
            -Xfswin "build\src\$env:BUILD_CONFIG\xfswin.exe" `
            -Image "rw\rw.img" `
            -Recipe "rw\rw-recipe.json" `
            -Overlay "rw\rw-overlay.bin"

      - name: Upload the read-write modified image
        uses: actions/upload-artifact@v4
        with:
          name: rw-modified
          path: rw/rw-work/rw-modified.img
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux verifies the read-write round trip: xfs_repair -n must stay clean,
  # the overwritten files must match the documented content with the overlays
  # applied, and every other file must be byte-identical to the pristine image.
  # ---------------------------------------------------------------------------
  linux-verify-rw:
    needs: windows-mount
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw-image
          path: rw

      - uses: actions/download-artifact@v4
        with:
          name: rw-modified
          path: modified

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows read-write modification
        run: |
          ls -l rw modified
          test "$(cat rw/rw-pristine.sha256)" = "$(sha256sum rw/rw.img | cut -d' ' -f1)"
          sudo bash tests/scripts/verify_rw_linux.sh \
            modified/rw-modified.img rw/rw.img rw/rw-recipe.json rw/rw-overlay.bin

      - name: The log parser must also read kernel-written logs
        run: |
          python3 tests/tools/log_probe.py rw/rw.img --expect clean
          python3 tests/tools/log_probe.py modified/rw-modified.img --expect clean

  # ---------------------------------------------------------------------------
  # Linux replays every crash window of the read-write writer. Each image was
  # killed at one XFSWIN_CRASH_AT point; the kernel has to mount it (replaying
  # our log record when it is committed), show either the old or the logged new
  # timestamps, and leave a filesystem xfs_repair -n accepts.
  # ---------------------------------------------------------------------------
  linux-verify-crash:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw-crash
          path: crash

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Replay and verify every crash window
        run: |
          ls -l crash | head -20
          sudo bash tests/scripts/verify_crash_linux.sh crash crash/pristine.img

  # ---------------------------------------------------------------------------
  # Linux verifies the RW-2 round trip: file extension, truncate, reuse of
  # freed blocks, a btree-format extent map, and reverse interoperability (the
  # kernel writes to a Windows-extended file).
  # ---------------------------------------------------------------------------
  linux-verify-rw2:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw2-images
          path: rw2

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Mount, replay and verify every RW-2 image
        run: |
          ls -l rw2
          sudo bash tests/scripts/verify_rw2_linux.sh rw2

      - name: Upload the reverse-interoperability image
        uses: actions/upload-artifact@v4
        with:
          name: rw2-reverse
          path: rw2/reverse.img
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux replays every RW-2 crash image: extend and truncate, every crash
  # point, both transactions of an extend. The kernel must see the old or the
  # new state, and xfs_repair -n must stay silent.
  # ---------------------------------------------------------------------------
  linux-verify-rw2-crash:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw2-crash
          path: crash-rw2

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Replay and verify every RW-2 crash window
        run: |
          ls -l crash-rw2 | head -20
          sudo bash tests/scripts/verify_crash_rw2_linux.sh crash-rw2

  # ---------------------------------------------------------------------------
  # Windows reads back the image Linux appended to: the reverse direction of
  # interoperability for an extended file.
  # ---------------------------------------------------------------------------
  windows-verify-rw2-reverse:
    needs: linux-verify-rw2
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw2-reverse
          path: rw2

      - name: Read the Linux-modified image with xfswin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "bin\xfswin.exe"
          python tests/tools/rw2_probe.py rw2/reverse.img --inode 67
          if ($LASTEXITCODE -ne 0) { throw "oracle rejected the reverse image" }
          # Start-Process redirects the child's stdout handle, so the binary
          # output is byte-exact on every PowerShell version (a pipeline or `>`
          # may decode and re-encode native output).
          $proc = Start-Process -FilePath $exe `
            -ArgumentList @('cat', 'rw2\reverse.img', '/hello.bin') `
            -RedirectStandardOutput 'reverse.bin' -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "cat failed on the reverse image ($($proc.ExitCode))"
          }
          $bytes = [System.IO.File]::ReadAllBytes("reverse.bin")
          if ($bytes.Length -ne 45019) {
            throw "reverse image size $($bytes.Length) != 45019"
          }
          $tail = [System.Text.Encoding]::ASCII.GetString(
            $bytes, $bytes.Length - 19, 19)
          if ($tail -ne 'LINUX-AFTER-WINDOWS') {
            throw "tail is '$tail', expected LINUX-AFTER-WINDOWS"
          }
          Write-Output "reverse interoperability verified: $($bytes.Length) bytes"

  # ---------------------------------------------------------------------------
  # Linux verifies the RW-3 round trip: create, mkdir, unlink, rmdir, a leaf
  # directory with churn, a node-format directory, and reverse interoperability
  # (the kernel creates, writes and removes inside a Windows-created
  # directory).
  # ---------------------------------------------------------------------------
  linux-verify-rw3:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw3-images
          path: rw3

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Mount, replay and verify every RW-3 image
        run: |
          ls -l rw3
          sudo bash tests/scripts/verify_rw3_linux.sh rw3

      - name: Upload the reverse-interoperability image
        uses: actions/upload-artifact@v4
        with:
          name: rw3-reverse
          path: rw3/reverse.img
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux replays every RW-3 crash image: create, mkdir, unlink and rmdir at
  # every crash point and transaction hit. The kernel must see the old or the
  # complete new state (no dangling dirents, no orphan inodes), and xfs_repair
  # -n plus the structural oracle must stay silent.
  # ---------------------------------------------------------------------------
  linux-verify-rw3-crash:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw3-crash
          path: crash-rw3

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Replay and verify every RW-3 crash window
        run: |
          ls -l crash-rw3 | head -20
          sudo bash tests/scripts/verify_crash_rw3_linux.sh crash-rw3

  # ---------------------------------------------------------------------------
  # Windows reads back the image the Linux kernel modified: files created,
  # written and removed inside a Windows-created directory.
  # ---------------------------------------------------------------------------
  windows-verify-rw3-reverse:
    needs: linux-verify-rw3
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw3-reverse
          path: rw3

      - name: Read the Linux-modified image with xfswin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "bin\xfswin.exe"
          python tests/tools/rw3_probe.py rw3/reverse.img --quiet
          if ($LASTEXITCODE -ne 0) { throw "oracle rejected the reverse image" }
          $listing = & $exe ls rw3\reverse.img /r3dir
          if ($LASTEXITCODE -ne 0) { throw "ls failed on the reverse image" }
          $text = $listing -join "`n"
          foreach ($name in @('child.bin', 'linux-after.txt', 'linuxdir')) {
            if ($text -notmatch [regex]::Escape($name)) {
              throw "the reverse image is missing $name"
            }
          }
          if ($text -match 'empty\.bin') {
            throw "empty.bin should have been removed by Linux"
          }
          # Start-Process keeps the child's stdout byte-exact (a pipeline may
          # decode and re-encode native output).
          $proc = Start-Process -FilePath $exe `
            -ArgumentList @('cat', 'rw3\reverse.img', '/r3dir/linux-after.txt') `
            -RedirectStandardOutput 'reverse.txt' -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "cat failed on the reverse image ($($proc.ExitCode))"
          }
          $content = [System.Text.Encoding]::ASCII.GetString(
            [System.IO.File]::ReadAllBytes("reverse.txt"))
          if ($content -ne 'LINUX-AFTER-WINDOWS') {
            throw "reverse content '$content' != LINUX-AFTER-WINDOWS"
          }
          Write-Output "RW-3 reverse interoperability verified"

  # ---------------------------------------------------------------------------
  # Linux replays and verifies every RW-4 image: rename (same directory, cross
  # directory, replace), directory moves with the ".." rewrite, hard links and
  # local/remote symlinks. Then the kernel renames, links and symlinks inside
  # the Windows-created namespace for the Windows reverse job.
  # ---------------------------------------------------------------------------
  linux-verify-rw4:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw4-images
          path: rw4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Mount, replay and verify every RW-4 image
        run: |
          ls -l rw4
          sudo bash tests/scripts/verify_rw4_linux.sh rw4

      - name: Upload the reverse-interoperability image
        uses: actions/upload-artifact@v4
        with:
          name: rw4-reverse
          path: rw4/reverse.img
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux replays every RW-4 crash image: rename, link and symlink at every
  # crash point and transaction hit. The kernel must see the old or the
  # complete new namespace (no dangling dirents, no wrong link counts, no
  # half-migrated "..", no leaked unlinked inodes), and xfs_repair -n plus the
  # structural oracle must stay silent.
  # ---------------------------------------------------------------------------
  linux-verify-rw4-crash:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw4-crash
          path: crash-rw4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Replay and verify every RW-4 crash window
        run: |
          ls -l crash-rw4 | head -20
          sudo bash tests/scripts/verify_crash_rw4_linux.sh crash-rw4

  # ---------------------------------------------------------------------------
  # Windows reads back the image the Linux kernel modified: Linux renames,
  # hard links and symlinks inside the Windows-created namespace, and Windows
  # must resolve all of it (including the raw symlink targets and the shared
  # hard-link inode) and mutate it again.
  # ---------------------------------------------------------------------------
  windows-verify-rw4-reverse:
    needs: linux-verify-rw4
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw4-reverse
          path: rw4

      - name: Read and re-mutate the Linux-modified image
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_rw4_reverse_windows.ps1 `
            -Exe "bin\xfswin.exe" -WorkDir "rw4"
          if ($LASTEXITCODE -ne 0) { throw "RW-4 reverse interoperability failed" }

  # ---------------------------------------------------------------------------
  # Raw device path (Case C): attach a fixed VHD as a real disk and format it
  # through \\.\PhysicalDriveN with the same backend used for real hardware.
  # ---------------------------------------------------------------------------
  windows-rawdevice-vhd:
    needs: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - name: Format a real (virtual) disk through the PhysicalDrive path
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_raw_device_windows.ps1 `
            -Xfswin "bin\xfswin.exe" `
            -VhdPath "$PWD\vhd\xfswin.vhd" `
            -SizeMB 512

      - name: Upload the VHD (raw payload for Linux verification)
        uses: actions/upload-artifact@v4
        with:
          name: rawdevice-vhd
          path: vhd/xfswin.vhd
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux verifies the filesystem written through the raw device path. A fixed
  # VHD is raw data followed by a 512-byte footer; strip it and run xfs_repair.
  # ---------------------------------------------------------------------------
  linux-verify-rawdevice:
    needs: windows-rawdevice-vhd
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rawdevice-vhd
          path: vhd

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Strip the VHD footer and verify with the real xfsprogs
        run: |
          size=$(stat -c %s vhd/xfswin.vhd)
          head -c $((size - 512)) vhd/xfswin.vhd > rawdevice.img
          ls -l rawdevice.img
          sudo bash tests/scripts/verify_windows_image_linux.sh rawdevice.img

  # ===========================================================================
  # RW-5: Windows-native journal recovery.
  #
  # Oracle A (already above): the dirty image is replayed by the Linux kernel.
  # Oracle B (here): the same class of dirty image is replayed by XFS for
  # Windows, then verified back on Linux. The two oracles are kept separate on
  # purpose: neither side may "prove itself".
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Recover every Windows-generated crash image (RW-1..RW-4) with xfswin, and
  # check the result from Windows itself (clean journal, `check`, and the
  # independent parser differential). The recovered copies are the artifact the
  # Linux job verifies.
  # ---------------------------------------------------------------------------
  windows-recover-windows-crash:
    needs: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [rw, rw2, rw3, rw4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.suite }}-crash
          path: crash-${{ matrix.suite }}

      - name: Recover the RW crash images
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_recovery_windows.ps1 `
            -Exe "bin\xfswin.exe" `
            -WorkDir "crash-${{ matrix.suite }}" `
            -OutDir "recovered-${{ matrix.suite }}" `
            -MaxImages 16
          if ($LASTEXITCODE -ne 0) { throw "Windows recovery of the ${{ matrix.suite }} crash matrix failed" }

      - name: Upload the recovered images
        uses: actions/upload-artifact@v4
        with:
          name: recovered-${{ matrix.suite }}
          path: recovered-${{ matrix.suite }}/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux mounts every image Windows recovered: no replay may be needed, the
  # metadata must be intact (xfs_repair -n silent) and the namespace readable.
  # ---------------------------------------------------------------------------
  linux-verify-windows-recovery:
    needs: windows-recover-windows-crash
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [rw, rw2, rw3, rw4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: recovered-${{ matrix.suite }}
          path: recovered-${{ matrix.suite }}

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows-recovered images with the Linux kernel
        run: |
          ls -l "recovered-${{ matrix.suite }}" | head -20
          sudo bash tests/scripts/verify_recovery_linux.sh "recovered-${{ matrix.suite }}"

  # ---------------------------------------------------------------------------
  # RW-5 crash-safety of recovery itself: kill xfswin inside recovery at every
  # recovery crash point, restart it, and require convergence.
  # ---------------------------------------------------------------------------
  windows-recovery-crash-matrix:
    needs: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [rw2, rw3, rw4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.suite }}-crash
          path: crash-${{ matrix.suite }}

      - name: Crash recovery at every recovery phase and restart it
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_recovery_crash_windows.ps1 `
            -Exe "bin\xfswin.exe" `
            -WorkDir "crash-${{ matrix.suite }}" `
            -OutDir "recovery-crash-${{ matrix.suite }}" `
            -Images 1
          if ($LASTEXITCODE -ne 0) { throw "recovery crash matrix failed for ${{ matrix.suite }}" }

      - name: Upload the restarted images
        uses: actions/upload-artifact@v4
        with:
          name: recovery-crash-${{ matrix.suite }}
          path: recovery-crash-${{ matrix.suite }}/
          if-no-files-found: error

  linux-verify-recovery-crash:
    needs: windows-recovery-crash-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [rw2, rw3, rw4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: recovery-crash-${{ matrix.suite }}
          path: recovery-crash-${{ matrix.suite }}

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the crash-restarted recoveries on Linux
        run: |
          sudo bash tests/scripts/verify_recovery_linux.sh "recovery-crash-${{ matrix.suite }}"

  # ---------------------------------------------------------------------------
  # The other direction (spec 34/53): the Linux kernel itself writes real dirty
  # logs (block-device snapshots of a mounted filesystem), Windows replays
  # them, Linux verifies namespace/content/allocator state.
  # ---------------------------------------------------------------------------
  linux-generate-dirty-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Generate the Linux dirty-log operation matrix
        run: |
          sudo bash tests/scripts/make_dirty_logs_linux.sh dirty-logs
          ls -l dirty-logs | head -40

      - name: Upload the Linux dirty logs
        uses: actions/upload-artifact@v4
        with:
          name: linux-dirty-logs
          path: |
            dirty-logs/*.img
            dirty-logs/*.manifest.json
            dirty-logs/*.logprint.txt
            dirty-logs/*.journal.json
            dirty-logs/inventory.txt
            dirty-logs/summary.txt
          if-no-files-found: error

  windows-recover-linux-logs:
    needs: [linux-generate-dirty-logs, windows-build-test]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: linux-dirty-logs
          path: dirty-logs

      - name: Replay the Linux-written dirty logs with xfswin
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/scripts/verify_recovery_windows.ps1 `
            -Exe "bin\xfswin.exe" `
            -WorkDir "dirty-logs" `
            -OutDir "recovered-linux"
          if ($LASTEXITCODE -ne 0) { throw "Windows recovery of the Linux dirty logs failed" }

      - name: Keep the manifests next to the recovered images
        shell: pwsh
        run: |
          Copy-Item "dirty-logs\*.manifest.json" "recovered-linux\" -Force
          Get-ChildItem "recovered-linux" | Select-Object Name, Length

      - name: Upload the recovered Linux logs
        uses: actions/upload-artifact@v4
        with:
          name: recovered-linux-logs
          path: recovered-linux/
          if-no-files-found: error

  linux-verify-cross-recovery:
    needs: windows-recover-linux-logs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: recovered-linux-logs
          path: recovered-linux

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Linux verifies the Windows replay of its own logs
        run: |
          ls -l recovered-linux | head -40
          sudo bash tests/scripts/verify_recovery_linux.sh recovered-linux

  # ===========================================================================
  # RW-6C: reflink / refcountbt / CoW qualification.
  #
  # None of these jobs opens the public read-write gate. They exercise the
  # hidden qualification path and produce the Linux evidence recorded in
  # docs/REFLINK.md.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Windows-formatted reflink images must be accepted by the real xfsprogs and
  # kernel for both legal profiles (rmapbt=0/1).
  # ---------------------------------------------------------------------------
  linux-verify-rw6c-windows-formatter:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: reflink, image: rw6c-normap.img }
          - { profile: reflink-rmapbt, image: rw6c-rmap.img }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-windows-formatted
          path: images

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows-formatted reflink image with Linux
        run: |
          sudo bash tests/scripts/verify_rw6c_linux.sh \
            "images/${{ matrix.image }}" \
            --label "Windows formatter ${{ matrix.profile }}"

  # ---------------------------------------------------------------------------
  # Linux creates the canonical reflink fixtures. The generator itself runs
  # xfs_repair -n and the independent refcount oracle before uploading.
  # ---------------------------------------------------------------------------
  linux-generate-rw6c:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Create both reflink fixtures
        run: |
          sudo env SIZE_MB=384 \
            bash tests/scripts/make_rw6c_linux.sh rw6c-linux
          sudo chown -R "$USER" rw6c-linux
          ls -lh rw6c-linux
          cat rw6c-linux/rw6c.oracle.txt
          cat rw6c-linux/rw6c-normap.oracle.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-linux
          path: rw6c-linux/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows mutates the Linux-created image: CoW source, clone, clone-of-clone,
  # shared truncate/unlink and a partial-EOF grow. The tool checks every byte
  # and runs the raw oracle.
  # ---------------------------------------------------------------------------
  windows-rw6c-roundtrip:
    needs: [windows-build-test, linux-generate-rw6c]
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6c, rw6c-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-linux
          path: rw6c-linux

      - name: Mutate the Linux reflink image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "rw6c-win-${{ matrix.profile }}" | Out-Null
          Copy-Item "rw6c-linux\${{ matrix.profile }}.img" `
            "rw6c-win-${{ matrix.profile }}\${{ matrix.profile }}.img" -Force
          python tests/tools/rw6c_windows_mutate.py `
            --exe "bin\xfswin.exe" `
            --image "rw6c-win-${{ matrix.profile }}\${{ matrix.profile }}.img" `
            --work-dir "rw6c-win-${{ matrix.profile }}" `
            --json "rw6c-win-${{ matrix.profile }}\mutated.manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "RW-6C Windows mutation failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-windows-${{ matrix.profile }}
          path: rw6c-win-${{ matrix.profile }}/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux verifies the Windows mutation with xfs_repair, the independent
  # oracle and a kernel mount, then performs the reverse mutation.
  # ---------------------------------------------------------------------------
  linux-verify-rw6c:
    needs: windows-rw6c-roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6c, rw6c-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-windows-${{ matrix.profile }}
          path: rw6c-win

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows mutation with Linux
        run: |
          sudo bash tests/scripts/verify_rw6c_linux.sh \
            "rw6c-win/${{ matrix.profile }}.img" \
            --manifest rw6c-win/mutated.manifest.json \
            --label "Windows-mutated ${{ matrix.profile }}"

      - name: Linux reverse mutation
        run: |
          mkdir -p rw6c-reverse
          cp --sparse=always "rw6c-win/${{ matrix.profile }}.img" \
            rw6c-reverse/reverse.img
          sudo bash tests/scripts/verify_rw6c_linux_reverse.sh \
            rw6c-reverse/reverse.img \
            rw6c-reverse/linux-reverse.manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-reverse-${{ matrix.profile }}
          path: |
            rw6c-reverse/reverse.img
            rw6c-reverse/linux-reverse.manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows reads and mutates the image after the Linux reverse pass.
  # ---------------------------------------------------------------------------
  windows-verify-rw6c-reverse:
    needs: linux-verify-rw6c
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6c, rw6c-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-reverse-${{ matrix.profile }}
          path: rw6c-reverse

      - name: Read and re-mutate after the Linux pass
        shell: pwsh
        run: |
          python tests/tools/rw6c_windows_reverse.py `
            --exe "bin\xfswin.exe" `
            --image rw6c-reverse/reverse.img `
            --manifest rw6c-reverse/linux-reverse.manifest.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6C reverse interoperability failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-reverse-final-${{ matrix.profile }}
          path: |
            rw6c-reverse/reverse.img
            rw6c-reverse/reverse-final.oracle.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux validates the final image after the Windows re-mutation.
  # ---------------------------------------------------------------------------
  linux-verify-rw6c-final:
    needs: windows-verify-rw6c-reverse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6c, rw6c-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-reverse-final-${{ matrix.profile }}
          path: rw6c-final

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the final image with Linux
        run: |
          sudo bash tests/scripts/verify_rw6c_linux.sh \
            rw6c-final/reverse.img \
            --label "RW-6C final ${{ matrix.profile }}"

  # ---------------------------------------------------------------------------
  # Crash matrix: clone, CoW and shared truncate at every meaningful window.
  # Each image is recovered on Windows, oracled, and archived with its
  # expected old-or-new content manifest.
  # ---------------------------------------------------------------------------
  windows-rw6c-crash:
    needs: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [rmap, normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - name: Run the RW-6C clone/CoW/truncate crash matrix
        shell: pwsh
        run: |
          python tests/tools/rw6c_crash_windows.py `
            --exe "bin\xfswin.exe" `
            --work-dir "crash-rw6c-${{ matrix.profile }}" `
            --profile ${{ matrix.profile }} `
            --zip `
            --json "crash-rw6c-${{ matrix.profile }}\crash.summary.json"
          if ($LASTEXITCODE -ne 0) { throw "RW-6C crash matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-crash-${{ matrix.profile }}
          path: |
            crash-rw6c-${{ matrix.profile }}/*.zip
            crash-rw6c-${{ matrix.profile }}/crash.summary.json
          if-no-files-found: error

  linux-verify-rw6c-crash:
    needs: windows-rw6c-crash
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [rmap, normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-crash-${{ matrix.profile }}
          path: crash-rw6c

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Validate the crash summary
        run: |
          python3 - crash-rw6c/crash.summary.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          if d.get("result") != "ok":
              raise SystemExit("Windows crash summary failed: %r" % d)
          if int(d.get("crashes", 0)) != int(d.get("cases", -1)):
              raise SystemExit("not every crash point was reached")
          if int(d.get("cases", 0)) < 10:
              raise SystemExit("crash matrix is too small")
          print("crash summary OK: %d cases" % d["cases"])
          PY

      - name: Verify every crash image with Linux
        run: |
          mkdir -p crash-rw6c/current
          checked=0
          for archive in crash-rw6c/*.zip; do
            [ -e "$archive" ] || continue
            rm -f crash-rw6c/current/*
            unzip -o "$archive" -d crash-rw6c/current
            image=$(find crash-rw6c/current -name '*.img' | head -1)
            manifest=$(find crash-rw6c/current -name '*.manifest.json' | head -1)
            test -n "$image"
            test -n "$manifest"
            sudo bash tests/scripts/verify_rw6c_linux.sh "$image" \
              --manifest "$manifest" --label "$(basename "$archive")"
            checked=$((checked + 1))
          done
          test "$checked" -ge 10
          echo "Verified $checked RW-6C crash images with Linux"

  # ---------------------------------------------------------------------------
  # Read-only paths and unsupported reflink geometry must still refuse and
  # change nothing, for both profiles.
  # ---------------------------------------------------------------------------
  windows-rw6c-refusal:
    needs: [windows-build-test, linux-generate-rw6c]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-linux
          path: rw6c-linux

      - name: No-write refusal matrix (read-only paths and unsupported geometry)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path rw6c-refusal | Out-Null
          Copy-Item rw6c-linux\rw6c.img rw6c-refusal\rw6c.img
          python tests/tools/rw6c_refusal_check.py `
            --exe "bin\xfswin.exe" --image rw6c-refusal/rw6c.img `
            --src /base/source.bin --dst /base/clone-a.bin `
            --empty-dir /emptydir --require-rmapbt `
            --json rw6c-refusal/rw6c-refusal.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6C reflink refusal matrix failed" }
          Copy-Item rw6c-linux\rw6c-normap.img rw6c-refusal\rw6c-normap.img
          python tests/tools/rw6c_refusal_check.py `
            --exe "bin\xfswin.exe" --image rw6c-refusal/rw6c-normap.img `
            --src /base/source.bin --dst /base/clone-a.bin `
            --empty-dir /emptydir `
            --json rw6c-refusal/rw6c-normap-refusal.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6C reflink-only refusal matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-refusal
          path: rw6c-refusal/*.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # ENOSPC: fill until no single block is free, then require a 4-block CoW
  # write to fail cleanly with no staging record and no data change.
  # ---------------------------------------------------------------------------
  windows-rw6c-enospc:
    needs: [windows-build-test, linux-generate-rw6c]
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6c, rw6c-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-linux
          path: rw6c-linux

      - name: Fill the image and exercise the ENOSPC CoW path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "rw6c-enospc-${{ matrix.profile }}" | Out-Null
          Copy-Item "rw6c-linux\${{ matrix.profile }}.img" `
            "rw6c-enospc-${{ matrix.profile }}\source.img" -Force
          python tests/tools/rw6c_enospc_windows.py `
            --exe "bin\xfswin.exe" `
            --image "rw6c-enospc-${{ matrix.profile }}\source.img" `
            --work-dir "rw6c-enospc-${{ matrix.profile }}" `
            --json "rw6c-enospc-${{ matrix.profile }}\enospc.json"
          if ($LASTEXITCODE -ne 0) { throw "RW-6C ENOSPC qualification failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-enospc-${{ matrix.profile }}
          path: |
            rw6c-enospc-${{ matrix.profile }}/enospc.img
            rw6c-enospc-${{ matrix.profile }}/enospc.json
          if-no-files-found: error

  linux-verify-rw6c-enospc:
    needs: windows-rw6c-enospc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6c, rw6c-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-enospc-${{ matrix.profile }}
          path: rw6c-enospc

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the ENOSPC image with Linux
        run: |
          sudo bash tests/scripts/verify_rw6c_enospc_linux.sh \
            rw6c-enospc/enospc.img rw6c-enospc/enospc.json

  # ---------------------------------------------------------------------------
  # Genuine Linux CUI capture: clone/CoW churn plus atomic dm-snapshots until
  # a committed refcount intent has no matching done item. The kernel-recovered
  # copy is the semantic oracle.
  # ---------------------------------------------------------------------------
  linux-generate-rw6c-cui:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs and dmsetup
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs dmsetup

      - name: Capture a surviving CUI
        run: |
          sudo env SIZE_MB=768 COW_MB=512 ROUNDS=100000 THREADS=8 \
            EXTENTS=1024 MAX_SNAPS=2500 \
            bash tests/scripts/make_rw6c_cui_linux.sh rw6c-cui
          sudo chown -R "$USER" rw6c-cui
          cat rw6c-cui/cui.manifest.json
          grep -q CUI rw6c-cui/cui.logprint.txt
          python3 tests/tools/rw6c_refcount_probe.py \
            rw6c-cui/cui.kernel-recovered.img --json /tmp/kernel.json

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-cui
          path: rw6c-cui/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows completes the genuine CUI and must match the kernel-recovered
  # semantic state exactly (sharing, CoW count and free blocks).
  # ---------------------------------------------------------------------------
  windows-recover-rw6c-cui:
    needs: [windows-build-test, linux-generate-rw6c-cui]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-cui
          path: rw6c-cui

      - name: Complete the surviving CUI on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path rw6c-recovered | Out-Null
          Copy-Item rw6c-cui/cui.img rw6c-recovered/cui-windows.img -Force
          python tests/tools/rw6c_cui_recover.py `
            --exe "bin\xfswin.exe" `
            --image rw6c-recovered/cui-windows.img `
            --kernel-oracle rw6c-cui/cui.kernel.oracle.json `
            --json rw6c-recovered/recovery.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6C genuine CUI recovery failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-windows-recovered-cui
          path: rw6c-recovered/
          if-no-files-found: error

  linux-verify-rw6c-cui:
    needs: windows-recover-rw6c-cui
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-windows-recovered-cui
          path: rw6c-recovered

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows CUI completion with Linux
        run: |
          sudo bash tests/scripts/verify_rw6c_linux.sh \
            rw6c-recovered/cui-windows.img --label "Windows CUI completion"

  # ---------------------------------------------------------------------------
  # Crash Windows while it completes the genuine CUI, restart recovery and
  # require convergence, no duplicate CUD and the same semantic state.
  # ---------------------------------------------------------------------------
  windows-rw6c-cui-crash:
    needs: [windows-build-test, linux-generate-rw6c-cui]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-cui
          path: rw6c-cui

      - name: Crash and restart the genuine CUI completion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path rw6c-cui-crash | Out-Null
          python tests/tools/rw6c_cui_recover.py `
            --exe "bin\xfswin.exe" `
            --image rw6c-cui/cui.img `
            --kernel-oracle rw6c-cui/cui.kernel.oracle.json `
            --crash-dir rw6c-cui-crash `
            --zip `
            --json rw6c-cui-crash/crash.summary.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6C CUI crash matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6c-cui-crash
          path: |
            rw6c-cui-crash/*.zip
            rw6c-cui-crash/crash.summary.json
          if-no-files-found: error

  linux-verify-rw6c-cui-crash:
    needs: windows-rw6c-cui-crash
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6c-cui-crash
          path: rw6c-cui-crash

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify every restarted CUI recovery with Linux
        run: |
          python3 - rw6c-cui-crash/crash.summary.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          if d.get("result") != "ok":
              raise SystemExit("CUI crash summary failed: %r" % d)
          if int(d.get("crashes", 0)) == 0:
              raise SystemExit("no CUI recovery crash point was reached")
          if len(d.get("runs", [])) != int(d.get("crashes", 0)):
              raise SystemExit("crash summary run count mismatch")
          print("CUI crash summary OK: %d crashes" % d["crashes"])
          PY
          mkdir -p rw6c-cui-crash/current
          checked=0
          for archive in rw6c-cui-crash/*.zip; do
            [ -e "$archive" ] || continue
            rm -f rw6c-cui-crash/current/*
            unzip -o "$archive" -d rw6c-cui-crash/current
            image=$(find rw6c-cui-crash/current -name '*.img' | head -1)
            test -n "$image"
            sudo bash tests/scripts/verify_rw6c_linux.sh "$image" \
              --label "$(basename "$archive")"
            checked=$((checked + 1))
          done
          expected=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["crashes"])' rw6c-cui-crash/crash.summary.json)
          test "$checked" -eq "$expected"
          echo "Verified $checked restarted CUI recovery images"

  # ===========================================================================
  # RW-6D: native extended attributes (shortform / leaf / node / remote / BMBT)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Record what the distribution's default mkfs.xfs actually enables.  This is
  # the evidence behind docs/DEFAULT_PROFILE.md; it is not a gate for the
  # writable profile (parent pointers are deliberately disabled for fixtures).
  # ---------------------------------------------------------------------------
  linux-record-mkfs-defaults:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Record the default and parent=0 profiles
        run: |
          set -euo pipefail
          mkdir -p rw6d-defaults
          mkfs.xfs -V | tee rw6d-defaults/version.txt
          truncate -s 512M rw6d-defaults/default.img
          mkfs.xfs -f rw6d-defaults/default.img \
            | tee rw6d-defaults/default.mkfs.txt
          xfs_info rw6d-defaults/default.img \
            > rw6d-defaults/default.xfs_info.txt 2>&1 || \
            echo "xfs_info cannot read a regular image file" \
              >> rw6d-defaults/default.xfs_info.txt
          xfs_db -r -c 'sb 0' -c 'p' rw6d-defaults/default.img \
            > rw6d-defaults/default.sb.txt
          xfs_db -r -c 'version' rw6d-defaults/default.img \
            > rw6d-defaults/default.version.txt

          if mkfs.xfs 2>&1 | grep -q 'parent='; then
            truncate -s 512M rw6d-defaults/parentless.img
            mkfs.xfs -f -n parent=0 rw6d-defaults/parentless.img \
              | tee rw6d-defaults/parentless.mkfs.txt
            xfs_info rw6d-defaults/parentless.img \
              > rw6d-defaults/parentless.xfs_info.txt 2>&1 || \
              echo "xfs_info cannot read a regular image file" \
                >> rw6d-defaults/parentless.xfs_info.txt
            xfs_db -r -c 'sb 0' -c 'p' rw6d-defaults/parentless.img \
              > rw6d-defaults/parentless.sb.txt
          else
            echo "mkfs.xfs has no parent= option" \
              > rw6d-defaults/parentless.unsupported.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rw6d-mkfs-defaults
          path: rw6d-defaults/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows-side native RW-6D matrix on the 1 KiB fixture: every transition on
  # a real image (shortform/leaf/node/level-2 node/remote/BMBT), directory and
  # symlink attributes, data writes, rename/hardlink/unlink and reflink.
  # ---------------------------------------------------------------------------
  windows-rw6d-native:
    needs: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-windows-fixture
          path: fixture

      - name: Mutate every attribute representation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path rw6d-native | Out-Null
          Copy-Item fixture/rw6d-windows.img rw6d-native/rw6d-windows.img
          python tests/tools/rw6d_windows_mutate.py `
            --exe bin/xfswin.exe `
            --image rw6d-native/rw6d-windows.img `
            --manifest fixture/rw6d-windows.img.manifest.json `
            --work-dir rw6d-native/work `
            --json rw6d-native/windows-mutated.manifest.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6D Windows mutation failed" }

      - name: Re-mutate after the simulated reverse pass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/tools/rw6d_windows_reverse.py `
            --exe bin/xfswin.exe `
            --image rw6d-native/rw6d-windows.img `
            --manifest rw6d-native/windows-mutated.manifest.json `
            --work-dir rw6d-native/reverse-work `
            --json rw6d-native/windows-final.manifest.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6D Windows reverse failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6d-windows-native
          path: |
            rw6d-native/rw6d-windows.img
            rw6d-native/windows-mutated.manifest.json
            rw6d-native/windows-final.manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Crash matrix: set/replace/remove across every representation, remote data,
  # node split/merge, BMBT growth, directory attr, unlink and rename.
  # ---------------------------------------------------------------------------
  windows-rw6d-crash:
    needs: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-windows-fixture
          path: fixture

      - name: Run the RW-6D crash matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/tools/rw6d_crash_windows.py `
            --exe bin/xfswin.exe `
            --image fixture/rw6d-windows.img `
            --manifest fixture/rw6d-windows.img.manifest.json `
            --work-dir crash-rw6d `
            --zip `
            --json crash-rw6d/crash.summary.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6D crash matrix failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6d-crash
          path: |
            crash-rw6d/*.zip
            crash-rw6d/crash.summary.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # ENOSPC: failed remote sets/replacements must leave the image byte-for-byte
  # equivalent (attribute values and structure) and a shortform set must still
  # work at zero free blocks.
  # ---------------------------------------------------------------------------
  windows-rw6d-enospc:
    needs: windows-build-test
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-windows-fixture
          path: fixture

      - name: Exhaust free space and require clean failures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path rw6d-enospc | Out-Null
          Copy-Item fixture/rw6d-windows.img rw6d-enospc/rw6d-enospc.img
          python tests/tools/rw6d_enospc_windows.py `
            --exe bin/xfswin.exe `
            --image rw6d-enospc/rw6d-enospc.img `
            --manifest fixture/rw6d-windows.img.manifest.json `
            --work-dir rw6d-enospc/work `
            --json rw6d-enospc/rw6d-enospc.manifest.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6D ENOSPC test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6d-enospc
          path: |
            rw6d-enospc/rw6d-enospc.img
            rw6d-enospc/rw6d-enospc.manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux verifies the Windows-created 1 KiB images (multi-level DA node and
  # attribute BMBT included) with xfs_repair and a kernel mount.
  # ---------------------------------------------------------------------------
  linux-verify-rw6d-windows:
    needs: [linux-record-mkfs-defaults, windows-rw6d-native,
            windows-rw6d-enospc]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-windows-fixture
          path: fixture

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-windows-native
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-enospc
          path: enospc

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows-created fixture and mutations
        run: |
          set -euo pipefail
          sudo bash tests/scripts/verify_rw6d_linux.sh \
            fixture/rw6d-windows.img \
            --manifest fixture/rw6d-windows.img.manifest.json \
            --label "Windows 1 KiB xattr fixture" --require-formats
          sudo bash tests/scripts/verify_rw6d_linux.sh \
            native/rw6d-windows.img \
            --manifest native/windows-final.manifest.json \
            --label "Windows 1 KiB xattr re-mutation" --require-formats
          sudo bash tests/scripts/verify_rw6d_linux.sh \
            enospc/rw6d-enospc.img \
            --manifest enospc/rw6d-enospc.manifest.json \
            --label "Windows 1 KiB xattr ENOSPC" --require-formats

  # ---------------------------------------------------------------------------
  # Linux creates the canonical 4 KiB fixtures in both legal reflink profiles.
  # The generator itself runs xfs_repair and the independent oracle and
  # requires every representation, including a level-2 DA node.
  # ---------------------------------------------------------------------------
  linux-generate-rw6d:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Create both xattr fixtures
        run: |
          sudo env SIZE_MB=512 bash tests/scripts/make_rw6d_linux.sh rw6d-linux
          sudo chown -R "$USER" rw6d-linux
          ls -lh rw6d-linux
          cat rw6d-linux/rw6d.oracle.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rw6d-linux
          path: rw6d-linux/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Windows reads every Linux attribute, mutates all representations and
  # writes windows-mutated.manifest.json.
  # ---------------------------------------------------------------------------
  windows-rw6d-roundtrip:
    needs: [windows-build-test, linux-generate-rw6d]
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6d, rw6d-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-linux
          path: rw6d-linux

      - name: Mutate the Linux xattr image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force `
            -Path "rw6d-win-${{ matrix.profile }}" | Out-Null
          Copy-Item "rw6d-linux/${{ matrix.profile }}.img" `
            "rw6d-win-${{ matrix.profile }}/${{ matrix.profile }}.img" -Force
          python tests/tools/rw6d_windows_mutate.py `
            --exe bin/xfswin.exe `
            --image "rw6d-win-${{ matrix.profile }}/${{ matrix.profile }}.img" `
            --manifest "rw6d-linux/${{ matrix.profile }}.manifest.json" `
            --work-dir "rw6d-win-${{ matrix.profile }}/work" `
            --json "rw6d-win-${{ matrix.profile }}/windows-mutated.manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "RW-6D Windows mutation failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6d-windows-${{ matrix.profile }}
          path: |
            rw6d-win-${{ matrix.profile }}/${{ matrix.profile }}.img
            rw6d-win-${{ matrix.profile }}/windows-mutated.manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux verifies the Windows mutation, then performs the reverse mutation on
  # a real kernel (including the level-2 tree, remote values and BMBT).
  # ---------------------------------------------------------------------------
  linux-verify-rw6d:
    needs: windows-rw6d-roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6d, rw6d-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-windows-${{ matrix.profile }}
          path: rw6d-win

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the Windows mutation with Linux
        run: |
          sudo bash tests/scripts/verify_rw6d_linux.sh \
            "rw6d-win/${{ matrix.profile }}.img" \
            --manifest rw6d-win/windows-mutated.manifest.json \
            --label "Windows-mutated ${{ matrix.profile }}" --require-formats

      - name: Linux reverse mutation
        run: |
          mkdir -p rw6d-reverse
          cp --sparse=always "rw6d-win/${{ matrix.profile }}.img" \
            rw6d-reverse/reverse.img
          sudo bash tests/scripts/verify_rw6d_linux_reverse.sh \
            rw6d-reverse/reverse.img \
            rw6d-win/windows-mutated.manifest.json \
            rw6d-reverse/linux-reverse.manifest.json
          sudo bash tests/scripts/verify_rw6d_linux.sh \
            rw6d-reverse/reverse.img \
            --manifest rw6d-reverse/linux-reverse.manifest.json \
            --label "Linux-reverse ${{ matrix.profile }}" --require-formats

      - uses: actions/upload-artifact@v4
        with:
          name: rw6d-reverse-${{ matrix.profile }}
          path: |
            rw6d-reverse/reverse.img
            rw6d-reverse/linux-reverse.manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows reads the Linux reverse image and mutates it once more.
  # ---------------------------------------------------------------------------
  windows-verify-rw6d-reverse:
    needs: linux-verify-rw6d
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6d, rw6d-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xfswin-exe
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-reverse-${{ matrix.profile }}
          path: rw6d-reverse

      - name: Read and re-mutate after the Linux pass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/tools/rw6d_windows_reverse.py `
            --exe bin/xfswin.exe `
            --image rw6d-reverse/reverse.img `
            --manifest rw6d-reverse/linux-reverse.manifest.json `
            --work-dir rw6d-reverse/final-work `
            --json rw6d-reverse/windows-final.manifest.json
          if ($LASTEXITCODE -ne 0) { throw "RW-6D Windows reverse failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: rw6d-reverse-final-${{ matrix.profile }}
          path: |
            rw6d-reverse/reverse.img
            rw6d-reverse/windows-final.manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux validates the final image after the Windows re-mutation.
  # ---------------------------------------------------------------------------
  linux-verify-rw6d-final:
    needs: windows-verify-rw6d-reverse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [rw6d, rw6d-normap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-reverse-final-${{ matrix.profile }}
          path: rw6d-final

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Verify the final image with Linux
        run: |
          sudo bash tests/scripts/verify_rw6d_linux.sh \
            rw6d-final/reverse.img \
            --manifest rw6d-final/windows-final.manifest.json \
            --label "RW-6D final ${{ matrix.profile }}" --require-formats

  # ---------------------------------------------------------------------------
  # Linux replays every restarted RW-6D crash image and requires the archived
  # old-or-new manifest to match.
  # ---------------------------------------------------------------------------
  linux-verify-rw6d-crash:
    needs: windows-rw6d-crash
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rw6d-crash
          path: crash-rw6d

      - name: Install xfsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs

      - name: Validate the crash summary
        run: |
          python3 - crash-rw6d/crash.summary.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          if d.get("result") != "ok":
              raise SystemExit("RW-6D crash summary failed: %r" % d)
          if int(d.get("crashes", 0)) == 0:
              raise SystemExit("no RW-6D crash point was reached")
          if int(d.get("archived", 0)) != int(d.get("crashes", 0)):
              raise SystemExit("archived crash image count mismatch")
          print("RW-6D crash summary OK: %d images" % d["crashes"])
          PY
          mkdir -p crash-rw6d/current
          checked=0
          for archive in crash-rw6d/*.zip; do
            [ -e "$archive" ] || continue
            rm -f crash-rw6d/current/*
            unzip -o "$archive" -d crash-rw6d/current
            image=$(find crash-rw6d/current -name '*.img' | head -1)
            manifest=$(find crash-rw6d/current -name '*.manifest.json' | head -1)
            test -n "$image"
            test -n "$manifest"
            sudo bash tests/scripts/verify_rw6d_linux.sh "$image" \
              --manifest "$manifest" --label "$(basename "$archive")"
            checked=$((checked + 1))
          done
          expected=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["crashes"])' crash-rw6d/crash.summary.json)
          test "$checked" -eq "$expected"
          echo "Verified $checked restarted RW-6D crash images"
