name: FUZZ-2 soak

# The long-running level is deliberately separate from ci.yml: a schedule
# trigger on the main workflow would run every job weekly.  Manual runs can
# override the operation count, seeds and workloads.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      steps:
        description: Operations per sequence
        required: false
        default: '2000'
      seeds:
        description: Space-separated seeds (empty = built-in fixed seeds)
        required: false
        default: ''
      workloads:
        description: Space-separated workloads (empty = mixed dir xattr alloc)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fuzz2-soak
  cancel-in-progress: false

jobs:
  linux-stateful-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install the reference xfsprogs (parent pointers)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl libinih-dev uuid-dev \
            liburcu-dev libblkid-dev libicu-dev
          sudo bash tests/scripts/install_xfsprogs_7_2_0.sh
          echo "/usr/local/sbin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DXFSWIN_BUILD_TESTS=ON
          -DXFSWIN_BUILD_WINFSP=OFF
          -DXFSWIN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Long stateful soak (kernel verification)
        env:
          SOAK_STEPS: ${{ github.event.inputs.steps || '2000' }}
          SOAK_SEEDS: ${{ github.event.inputs.seeds }}
          SOAK_WORKLOADS: ${{ github.event.inputs.workloads }}
        run: |
          set -euo pipefail
          sudo env EXE="$PWD/build/tests/stateful_fuzz" WORK="$PWD/fuzz2-soak" \
            STEPS="$SOAK_STEPS" SEEDS="$SOAK_SEEDS" \
            WORKLOADS="$SOAK_WORKLOADS" \
            bash tests/scripts/fuzz2_soak.sh

      - name: Upload soak failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz2-soak-failure
          path: fuzz2-soak/
          if-no-files-found: ignore
